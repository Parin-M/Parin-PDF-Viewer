name: Parin PDF Viewer CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Install Linux packaging libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev patchelf libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libxcb-xkb1 libdbus-1-3 libfontconfig1 libx11-xcb1
      - name: Build Debian package
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          bash scripts/build-deb.sh
      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: parin-pdf-9.0.0-deb
          path: dist-deb/parin-pdf_9.0.0_amd64.deb
          if-no-files-found: error
          retention-days: 14
